/* Theme readability: shared type scale, semantic night surfaces, and scalable controls. */
:root{
  --type-caption:max(.8rem,12px);
  --type-small:max(.86rem,13px);
  --type-control:max(.9rem,13px);
  --focus:#6f38b4;
}
@media screen{
  .topbar{height:auto;min-height:65px}
  .panel-header{flex-wrap:wrap;row-gap:8px}
  .panel-header h2{min-width:0;overflow-wrap:anywhere}
  .week-controls{flex-wrap:wrap;margin-left:auto;font-size:var(--type-caption)}
  .week-controls .icon{width:20px;height:20px}
  .week-controls button{min-width:26px;min-height:28px}
  .searchbox input,.profile,.pill,.btn,.toolbar select,.page-head .btn{font-size:var(--type-control)}
  .stat-label,.checkline,.day-label,.task-title,.lesson-info strong,.column h3,.seat{font-size:var(--type-small)}
  .stat small,.textbtn,.time,.lesson-info small,.task-meta,.task-moves button,.column-add,.data-table th,.calendar-cell,.event-chip,.mini-month .calendar-cell,.mini-month h3,.badge,.ring small,.demo-ribbon,.data-table small,.adv-table small{font-size:var(--type-caption)}
  .class-row{font-size:var(--type-small);align-items:flex-start;gap:8px}
  .class-row .time{flex:0 0 7.4em;min-width:0;font-variant-numeric:tabular-nums}
  .class-row .dot{margin-top:.5em}
  .class-row .textbtn{flex:1;min-width:0;overflow-wrap:anywhere}
  .lesson-info strong,.lesson-info small,.task-name,.checkline span{overflow-wrap:anywhere}
  .lesson-info{line-height:1.5}
  .lesson-row{align-items:flex-start}
  .lesson-row .iconbtn{min-width:28px;min-height:28px}
  .column h3{flex-wrap:wrap;row-gap:3px}
  .task-title{line-height:1.5}
  .task-title input,.checkline input{width:17px;height:17px;flex-shrink:0}
  .task-moves{flex-wrap:wrap;gap:5px}
  .task-moves button,.column-add{min-height:30px}
  .badge{font-size:.85em}
  .stat small{line-height:1.5}
  .stat-art{opacity:.45}
  .wellness-inner{flex-wrap:wrap;justify-content:center}
  .ring{width:8.4rem;height:8.4rem;min-width:110px;min-height:110px}
  .ring small{text-align:center;padding:0 4px;line-height:1.35}
  .ring b{font-size:1.6rem}
  .checklist{min-width:0}
  .note-paper .checkline{align-items:flex-start}
  .note-paper .checkline input{margin-top:3px}
  .more-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .more-grid button{min-width:0;overflow-wrap:anywhere;flex-wrap:wrap}
  .seating{grid-template-columns:repeat(auto-fit,minmax(105px,1fr))}
  .seat{overflow-wrap:anywhere}
  :is(button,a,input,select,textarea,summary):focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .searchbox:focus-within{outline:3px solid var(--focus);outline-offset:3px}
  .task.done .task-name,.done-text{opacity:.85}
  .dark{
    color-scheme:dark;
    --ink:#f4eeff;
    --muted:#d1c5e3;
    --accent:#d6b5ff;
    --mint:#a6e5d2;
    --glass:linear-gradient(135deg,#332743f5,#3c2d50f5);
    --edge:#9e7db24d;
    --shadow:0 8px 24px #100a202e;
    --focus:#e0c1ff;
    --night-control:#352943;
    --night-raised:#443353;
    --night-soft:#4d3b60;
    --night-border:#9b7db966;
    --night-link:#e1c4ff;
  }
  .dark:before{filter:brightness(.4) saturate(.8)}
  .dark .sidebar{background:linear-gradient(145deg,#302640f5,#3b2d50ee);color:var(--ink);border-color:var(--edge)}
  .dark .topbar{background:linear-gradient(120deg,#372b49f2,#47355cf0);color:var(--ink)}
  .dark .brand{border-color:var(--night-border)}
  .dark .brand em,.dark .wordmark em,.dark .attribution .wordmark em{color:var(--mint)}
  .dark .nav button.active,.dark .bottomnav button.active{background:#73509a;color:#fff;box-shadow:inset 0 1px 0 #dfbaff44,0 2px 10px #12081d22}
  .dark .nav button:hover,.dark .sidebottom button:hover{background:#aa7cd126}
  .dark .hero{background:linear-gradient(110deg,#4b305df5,#513b6ff0)}
  .dark .hero h1,.dark .stat-value{color:#e9ccff}
  .dark .hero-art{mix-blend-mode:normal;filter:brightness(.7) saturate(.8);opacity:.65}
  .dark :is(.searchbox,.topbar select,.field input,.field select,.field textarea,.toolbar input,.toolbar select,.data-table input,.data-table select,.adv-search){background:var(--night-control);border-color:var(--night-border);color:var(--ink)}
  .dark input::placeholder,.dark textarea::placeholder{color:#c6b5da;opacity:1}

  .dark .btn{background:#7444a3;border-color:#af80d2;color:#fff}

  .dark .btn.danger,.dark .adv-danger{background:#64364f;border-color:#c584a0;color:#ffe3ee}
  .dark :is(.textbtn,.week-controls button,.column-add,.calendar-cell header button,.quick-actions .icon,.panel-header h2 .icon,.adv-favorite){color:var(--night-link)}
  .dark :is(.stat .stat-icon){color:#e3c2ff;background:#9163b638}
  .dark .stat small{color:var(--mint)}
  .dark :is(.lesson-row,.task,.day-classes,.data-table td,.calendar-cell,.type-preview,.mini-month,.search-result,.adv-assessment,.timer){background:var(--night-control);color:var(--ink);border-color:var(--night-border)}
  .dark .record-card{background:var(--glass);color:var(--ink)}
  .dark .schedule-day.selected{background:#71508f66}
  .dark .column:nth-child(1){background:#523b6966}
  .dark .column:nth-child(2){background:#35516b66}
  .dark .column:nth-child(3){background:#653d5766}
  .dark .column:nth-child(4){background:#2e5a5066}
  .dark .column{border-color:var(--night-border)}
  .dark .column.dragover{box-shadow:inset 0 0 0 3px #d4a8f5,0 0 20px #b58ad944}
  .dark .badge,.dark .adv-badge,.dark .demo-ribbon{background:#604478;color:#f5e7ff}

  .dark .modal{background:#33273f;border-color:var(--night-border);color:var(--ink)}
  .dark .more-sheet .wordmark,.dark .attribution .wordmark{color:var(--ink)}
  .dark .more-sheet .wordmark em{color:var(--mint)}
  .dark .more-sheet .wordmark svg path:first-child,.dark .help-copy .wordmark svg path:first-child{stroke:#f4eeff}
  .dark .more-sheet:before{background:#bc9ed5}

  .dark.high-contrast .task.done .task-name,.dark.high-contrast .done-text{opacity:1}

function editEvent(id,date=calDate){let e=S.events.find(x=>x.id===id);if(!e&&limit('events'))return;openForm(e?'Edit event':'Add event',eventFields,d=>{if(d.until&&d.until<d.date){toast('Repeat end must follow start');return false}if(e)Object.assign(e,d);else S.events.push({...d,id:uid(),custom:true});save();render();toast('Saved')},{date,subject:'General',recurrence:'None',...e},e?{delete:()=>remove('events',id)}:null)}
function eventsFor(date){return [...S.events.filter(e=>{if(e.date===date)return true;if(date<e.date||(e.until&&date>e.until))return false;if(e.recurrence==='Daily')return true;if(e.recurrence==='Weekly')return new Date(date+'T12:00:00').getDay()===new Date(e.date+'T12:00:00').getDay();if(e.recurrence==='Monthly')return date.slice(8)===e.date.slice(8);return false}).map(e=>({...e,isEvent:true})),...S.lessons.filter(l=>l.date===date)].sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function calendarPage(){let d=new Date(calDate+'T12:00:00');return header('Calendar','Make room for what matters.','add-event','Add event')+`<section class="glass panel"><div class="toolbar"><button class="iconbtn" data-action="cal-prev" aria-label="${tr('Previous')}">${icon('left')}</button><h2>${calView==='Academic year'?d.getFullYear():fmt(calDate,{month:'long',year:'numeric',...(calView==='Daily'?{day:'numeric'}:{})})}</h2><button class="iconbtn" data-action="cal-next" aria-label="${tr('Next')}">${icon('right')}</button>${button('Today','cal-today')}<div class="switchgroup">${['Daily','Weekly','Monthly','Academic year'].map(v=>`<button data-action="cal-view" data-view="${v}" class="${v===calView?'active':''}">${tr(v)}</button>`).join('')}</div></div>${calView==='Academic year'?`<div class="calendar-year">${Array.from({length:12},(_,m)=>monthGrid(d.getFullYear(),m,true)).join('')}</div>`:calView==='Monthly'?monthGrid(d.getFullYear(),d.getMonth()):calView==='Weekly'?`<div class="calendar-grid calendar-week">${Array.from({length:7},(_,i)=>calendarCell(addDays(monday(calDate),i))).join('')}</div>`:`<div class="calendar-day">${eventsFor(calDate).map(e=>`<button class="search-result" data-action="${e.isEvent?'edit-event':'edit-lesson'}" data-id="${e.id}"><strong>${esc(e.time)} ${esc(e.title)}</strong><small>${esc(e.description)}</small></button>`).join('')||empty()}</div>`}</section>`}
function monthGrid(year,month,mini=false){let first=new Date(year,month,1,12),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));let cells=Array.from({length:42},(_,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);return calendarCell(iso(d),mini,d.getMonth()!==month)}).join('');return `${mini?`<div class="mini-month"><h3>${first.toLocaleDateString(prefs.lang,{month:'long'})}</h3>`:''}<div class="calendar-grid">${Array.from({length:7},(_,i)=>`<small style="text-align:center">${fmt(addDays('2026-11-16',i),{weekday:'short'})}</small>`).join('')}${cells}</div>${mini?'</div>':''}`}
function calendarCell(date,mini=false,fade=false){let events=eventsFor(date);return `<div class="calendar-cell ${date===today()?'today':''}" style="${fade?'opacity:.4':''}"><header><button data-action="cal-day" data-date="${date}">${Number(date.slice(8))}</button>${mini?'':`<button data-action="new-event-date" data-date="${date}" aria-label="${tr('Add event')}">＋</button>`}</header>${mini?(events.length?'<span class="dot" style="width:5px;height:5px"></span>':''):events.map(e=>`<button class="event-chip" data-action="${e.isEvent?'edit-event':'edit-lesson'}" data-id="${e.id}" style="border-color:${subjectColor(e.subject)}">${esc(e.time)} ${esc(e.title)}</button>`).join('')}</div>`}

function wellnessPage(){let w=progressRecord()||{};return header('Teacher Wellness','You take care of everyone. Make time for you, too.')+`<div class="content-grid"><section class="panel glass">${wellnessWidget()}<form id="wellness-form" style="margin-top:20px"><div class="form-grid">${formFields([{key:'mood',label:'Mood',type:'select',options:['Wonderful','Good','Okay','Low','Difficult']},{key:'energy',label:'Energy',type:'range',min:1,max:5},{key:'gratitude',label:'Gratitude',type:'textarea'},{key:'reflection',label:'Daily reflection',type:'textarea'},{key:'weekly',label:'Weekly reflection',type:'textarea'},{key:'goals',label:'Professional goals',type:'textarea'}],{mood:'Good',energy:3,...w})}</div><div class="form-actions"><button class="btn" type="submit">${tr('Save check-in')}</button></div></form></section><section class="panel glass"><h2>${tr('Wellness history')}</h2><div class="chart-bars">${S.wellness.slice(-7).map(w=>`<div class="chart-bar" style="height:${Math.max(5,w.checks.filter(Boolean).length/4*100)}%"><small>${fmt(w.date)}</small></div>`).join('')}</div>${[...S.wellness].reverse().slice(0,14).map(w=>`<article class="lesson-row"><div class="lesson-info"><strong>${fmt(w.date)} · ${tr(w.mood||'Good')} · ⚡${w.energy||3}/5</strong><small>${esc(w.gratitude||w.reflection||'')}</small></div></article>`).join('')||empty()}</section></div>`}

function openForm(title,fields,onSave,initial={},extras=null){formCallback=onSave;modalExtra=extras;showDialog(title,`<form id="record-form"><div class="form-grid">${formFields(fields,initial)}</div><div class="form-actions">${extras?.delete?`<button type="button" class="btn danger" data-action="record-delete">${tr('Delete')}</button>`:''}${(extras?.extra||[]).map((e,i)=>`<button type="button" class="btn secondary" data-action="record-extra" data-index="${i}">${tr(e.label)}</button>`).join('')}<button type="button" class="btn secondary" data-action="close">${tr('Cancel')}</button><button class="btn" type="submit">${tr('Save')}</button></div></form>`);$('#record-form').onsubmit=e=>{e.preventDefault();let data={};for(let f of fields){let input=e.target.elements[f.key];data[f.key]=f.type==='checkbox'?input.checked:f.type==='number'||f.type==='range'?(input.value===''?'':Number(input.value)):input.value.trim();if(f.required&&(data[f.key]===''||data[f.key]===null||data[f.key]===undefined)){toast('Please complete required fields.');sound('error');return}}let cb=formCallback;let result=cb(data);if(result!==false){closeDialog();sound('success')}}}

function bindDrag(){let dragged=null;$$('.task[draggable]').forEach(el=>{el.ondragstart=e=>{dragged=el.dataset.id;e.dataTransfer.setData('text/plain',dragged);e.dataTransfer.effectAllowed='move';el.style.opacity='.5'};el.ondragend=()=>{el.style.opacity='1';$$('.dragover').forEach(c=>c.classList.remove('dragover'))}});$$('.column').forEach(col=>{col.ondragover=e=>{e.preventDefault();col.classList.add('dragover')};col.ondragleave=e=>{if(!col.contains(e.relatedTarget))col.classList.remove('dragover')};col.ondrop=e=>{e.preventDefault();let id=e.dataTransfer.getData('text/plain')||dragged,t=S.tasks.find(x=>x.id===id);if(!t)return;let target=e.target.closest('.task');S.tasks=S.tasks.filter(x=>x.id!==id);t.status=col.dataset.status;let idx=target?S.tasks.findIndex(x=>x.id===target.dataset.id):-1;if(idx>=0)S.tasks.splice(idx,0,t);else S.tasks.push(t);save();sound(t.status==='done'?'success':'drop');render()}})}
function moveTask(id,dir){let t=S.tasks.find(x=>x.id===id);if(!t)return;t.status=statuses[Math.max(0,Math.min(3,statuses.indexOf(t.status)+dir))];save();sound(t.status==='done'?'success':'drop');render()}
function toggleTask(id,done){let t=S.tasks.find(x=>x.id===id);if(!t)return;t.status=done?'done':'todo';if(done&&t.recurrence!=='None'&&t.recurrence){if(!limit('tasks'))S.tasks.push({...structuredClone(t),id:uid(),status:'todo',due:addDays(t.due||today(),t.recurrence==='Daily'?1:7),custom:true})}save();sound(done?'success':'tap');render()}
function saveWellnessCheck(i,checked){let w=progressRecord();if(!w){w={id:uid(),date:today(),checks:[false,false,false,false]};S.wellness.push(w)}w.checks[i]=checked;save();render();if(checked)sound('success')}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id;if(prefs.click)sound('tap');if(a.startsWith('nav:')){taskQuery='';navigate(a.slice(4));return}if(a.startsWith('adv:')){if(typeof advancedAction==='function')advancedAction(a,id,e);return}switch(a){case'close':closeDialog();break;case'help':help();break;case'more-nav':closeDialog();navigate(el.dataset.page);break;case'theme':prefs.dark=!prefs.dark;savePrefs();break;case'notifications':notifications();break;case'add-task':editTask(null,el.dataset.status);break;case'edit-task':editTask(id);break;case'move-task':moveTask(id,Number(el.dataset.dir));break;case'up-task':{let i=S.tasks.findIndex(t=>t.id===id),p=S.tasks.slice(0,i).findLastIndex(t=>t.status===S.tasks[i].status);if(p>=0){let t=S.tasks.splice(i,1)[0];S.tasks.splice(p,0,t);save();render()}break}case'add-lesson':editLesson();break;case'edit-lesson':editLesson(id);break;case'duplicate-lesson':editLesson(id,true);break;case'print-lesson':printLesson(S.lessons.find(l=>l.id===id));break;case'add-event':editEvent();break;case'edit-event':editEvent(id);break;case'new-event-date':editEvent(null,el.dataset.date);break;case'cal-day':calDate=el.dataset.date;calView='Daily';render();break;case'cal-view':calView=el.dataset.view;render();break;case'cal-prev':case'cal-next':{let n=a==='cal-prev'?-1:1,d=new Date(calDate+'T12:00:00');if(calView==='Academic year')d.setFullYear(d.getFullYear()+n);else if(calView==='Monthly'){d.setDate(1);d.setMonth(d.getMonth()+n)}else d.setDate(d.getDate()+n*(calView==='Weekly'?7:1));calDate=iso(d);render();break}case'cal-today':calDate=today();render();break;case'day-prev':case'day-next':selectedDay=addDays(selectedDay,a==='day-prev'?-1:1);week=monday(selectedDay);render();break;case'week-prev':case'week-next':week=addDays(week,a==='week-prev'?-7:7);selectedDay=week;render();break;case'add-student':editStudent();break;case'edit-student':editStudent(id);break;case'add-class':editClass();break;case'manage-classes':manageClasses();break;case'edit-class':editClassRecord(id);break;case'student-view':studentView=el.dataset.view;render();break;case'all-present':S.students.filter(s=>!studentClass||s.className===studentClass).forEach(s=>setAttendance(s.id,'Present'));render();toast('Saved');break;case'task-view':taskView=el.dataset.view;render();break;case'timer-toggle':timerToggle();break;case'timer-clear':clearInterval(timerHandle);timerHandle=null;timerSeconds=Math.min(180,Math.max(1,Number($('#timer-minutes')?.value)||25))*60;render();break;case'add-note':openForm('Add note',[{key:'title',label:'Title',required:true}],d=>{S.notes.push({...d,id:uid(),done:false});save();render()});break;case'delete-note':S.notes=S.notes.filter(n=>n.id!==id);save();render();break;case'record-delete':{let cb=modalExtra?.delete;closeDialog();cb?.();break}case'record-extra':{let cb=modalExtra?.extra[Number(el.dataset.index)].action;closeDialog();cb?.();break}case'print':window.print();break;case'font-preset':prefs.fontSize=Number(el.dataset.size);savePrefs();render();break;case'reset-type':Object.assign(prefs,{fontSize:15,font:'Modern Sans',weight:400,line:1.5});savePrefs();render();break;case'test-sound':if(!prefs.sound){toast('Enable sound to test');break}sound('success');break;}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='lang'){prefs.lang=t.value;savePrefs();render()}if(t.dataset.pref){let k=t.dataset.pref,v=t.type==='checkbox'?t.checked:t.value;if(['fontSize','weight','line','volume'].includes(k))v=Number(v);if(k==='fontSize')v=Math.max(12,Math.min(22,v||15));if(k==='name')v=String(v).trim().slice(0,100)||'Ms. Carter';prefs[k]=v;savePrefs();if(k==='lang')render()}if(t.dataset.widget){prefs.widgets[t.dataset.widget]=t.checked;savePrefs()}if(t.dataset.note){let n=S.notes.find(x=>x.id===t.dataset.note);n.done=t.checked;save();render()}if(t.dataset.well!==undefined)saveWellnessCheck(Number(t.dataset.well),t.checked);if(t.dataset.subtask){let task=S.tasks.find(x=>x.id===t.dataset.subtask);task.subtaskDone??=task.subtasks.map(()=>false);task.subtaskDone[Number(t.dataset.index)]=t.checked;save();render()}if(t.dataset.taskCheck)toggleTask(t.dataset.taskCheck,t.checked);if(t.id==='lesson-template'&&t.value)editLesson(null,false,t.value);if(t.id==='priority-filter'){taskPriority=t.value;render()}if(t.id==='subject-filter'){taskSubject=t.value;render()}if(t.id==='class-filter'){studentClass=t.value;render()}if(t.id==='attendance-date'){selectedDay=t.value;render()}if(t.dataset.attendance){setAttendance(t.dataset.attendance,t.value);toast('Saved')}if(t.dataset.participation){setAttendance(t.dataset.participation,Math.min(5,Math.max(0,Number(t.value))),'participation');toast('Saved')}});
let filterTimer;document.addEventListener('input',e=>{if(['task-filter','lesson-filter'].includes(e.target.id)){taskQuery=e.target.value;clearTimeout(filterTimer);filterTimer=setTimeout(()=>{let id=e.target.id,pos=e.target.selectionStart;render();let input=$('#'+id);input?.focus();input?.setSelectionRange(pos,pos)},180)}if(e.target.dataset.pref&&e.target.type==='range'){prefs[e.target.dataset.pref]=Number(e.target.value);savePrefs()}});
document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();let q=e.target.search.value.trim().toLowerCase();showDialog('Search',`<div class="search-results">${[['lessons','edit-lesson'],['tasks','edit-task'],['students','edit-student'],['events','edit-event']].flatMap(([key,action])=>S[key].filter(x=>q&&JSON.stringify(x).toLowerCase().includes(q)).map(x=>`<button class="search-result" data-action="${action}" data-id="${x.id}"><strong>${esc(x.title||x.name)}</strong><small>${tr(({lessons:'Lessons',tasks:'Tasks',students:'Students',events:'Calendar'})[key])}</small></button>`)).join('')||empty()}</div>`)}if(e.target.id==='wellness-form'){e.preventDefault();let w=progressRecord();if(!w){w={id:uid(),date:today(),checks:[false,false,false,false]};S.wellness.push(w)}Object.assign(w,Object.fromEntries(new FormData(e.target)));w.energy=Number(w.energy);save();render();toast('Saved');sound('success')}});
document.addEventListener('pointerover',e=>{if(e.pointerType==='mouse'&&prefs.hover&&e.target.closest('button')&&Date.now()-lastHover>180){lastHover=Date.now();sound('hover')}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){let r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
$('#modal').addEventListener('close',()=>lastFocus?.isConnected&&lastFocus.focus());
function atmosphere(){let stars=Array.from({length:36},(_,i)=>`<span class="star" style="left:${(i*29.7)%100}%;top:${(i*17.3)%100}%;animation-delay:-${i%7}s;font-size:${i%3?10:20}px">✦</span>`).join('');let station=`<svg viewBox="0 0 80 100" fill="none" stroke="currentColor" stroke-width="2"><rect x="12" y="10" width="52" height="76" rx="5" fill="#e0bbff55" transform="rotate(-13 40 50)"/><path d="M25 26h26M23 39h27M20 52h27M18 65h27"/><path d="M12 20h8m-10 10h8m-10 10h8m-10 10h8m-10 10h8"/></svg>`;let clip=`<svg viewBox="0 0 60 100" fill="none" stroke="currentColor" stroke-width="3"><path d="M23 70 43 28c12-25-20-36-29-13L2 45c-9 23 17 34 27 10L41 26c5-14-10-17-15-5L13 51"/></svg>`;let pencil=`<svg viewBox="0 0 80 100"><path d="m15 85 8-30 37-48 15 12-37 48z" fill="#e9c8ff" stroke="#fff0ff" stroke-width="2"/><path d="m15 85 8-30 15 12z" fill="#f7deb6"/><path d="m15 85 5-12 4 4z" fill="#9472bc"/><path d="m27 59 37-47m-32 51 37-47" stroke="#a384d0" stroke-width="2"/></svg>`;let plant=`<svg viewBox="0 0 200 320"><path d="M100 330q0-150-55-280m55 280q0-160 57-260" fill="none" stroke="#7165a3" stroke-width="4"/>${Array.from({length:10},(_,i)=>`<ellipse cx="${i%2?77:119}" cy="${65+i*22}" rx="12" ry="29" transform="rotate(${i%2?-38:38} ${i%2?77:119} ${65+i*22})" fill="${i%2?'#9580c6':'#b29ad8'}"/>`).join('')}</svg>`;$('.atmosphere').innerHTML=`<div class="moon"></div>${stars}<div class="floater" style="left:4%;top:48%;transform:rotate(-20deg)">${station}</div><div class="floater" style="left:13%;top:2%;width:30px">${clip}</div><div class="floater" style="right:3%;top:71%;animation-delay:-7s">${pencil}</div><div class="floater" style="right:2%;top:29%;width:30px;animation-delay:-9s">${clip}</div><div class="botanical" style="left:-75px">${plant}</div><div class="botanical" style="right:-70px;transform:scaleX(-1)">${plant}</div><svg class="lantern" viewBox="0 0 220 240" aria-hidden="true"><defs><radialGradient id="candle-glow"><stop stop-color="#ffe7a9" stop-opacity=".9"/><stop offset="1" stop-color="#ffe1d0" stop-opacity="0"/></radialGradient></defs><circle cx="120" cy="150" r="100" fill="url(#candle-glow)"/><path d="M25 210h125v22H25z" fill="#ab87ce" stroke="#e8c7f5" stroke-width="2"/><path d="M35 188h120v22H35z" fill="#ddacd9" stroke="#f7d9ed" stroke-width="2"/><path d="M125 66V44c0-30 36-30 36 0v22m-49 22 30-25 32 25m-56 0h51v126h-51z" fill="#b394ce" stroke="#f3d4ed" stroke-width="5"/><path d="M124 99h38v103h-38z" fill="#ffdeaa99"/><path d="M139 196v-48h13v48" fill="#fff3d4"/><path d="M145 147c-15-14 4-31 1-39 18 20 10 35-1 39" fill="#fff4c1"/><path d="M112 212h65v13h-65z" fill="#bb92c0" stroke="#f4d7f3" stroke-width="3"/></svg><div class="clouds"></div>`}
atmosphere();load();
function manageClasses(){showDialog('Classes',S.classes.map(c=>`<div class="lesson-row"><span style="flex:1">${esc(c.name)} · ${esc(c.subject)}</span>${button('Edit','edit-class',`data-id="${esc(c.id)}"`)}</div>`).join('')||empty())}
function editClassRecord(id){let c=S.classes.find(x=>x.id===id);if(!c)return;openForm('Edit class',[{key:'name',label:'Class name',required:true},{key:'subject',label:'Subject'}],d=>{let old=c.name;if(S.classes.some(x=>x.id!==id&&x.name===d.name)){toast('Class already exists');return false}Object.assign(c,d);for(let key of ['students','lessons','tasks'])S[key].forEach(x=>{if(x.className===old)x.className=d.name});save();render();toast('Saved')},c,{delete:()=>showConfirm('Delete this class?',()=>{let old=c.name;S.classes=S.classes.filter(x=>x.id!==id);for(let key of ['students','lessons','tasks'])S[key].forEach(x=>{if(x.className===old)x.className=''});save();render();toast('Deleted')})})}

window.matchMedia('(max-width:650px)').addEventListener('change',()=>render());

function syncThemeControls(){
  document.documentElement.style.colorScheme=prefs.dark?'dark':'light';
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',prefs.dark?'#30254c':'#a99be4');
  document.querySelectorAll('[data-pref="dark"]').forEach(input=>input.checked=prefs.dark);
  document.querySelectorAll('[data-action="theme"]').forEach(toggle=>{toggle.setAttribute('aria-pressed',String(prefs.dark));toggle.setAttribute('title',tr(prefs.dark?'Light mode':'Dark mode'));toggle.innerHTML=icon(prefs.dark?'sun':'moon')});
}
